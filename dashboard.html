<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sriox Careers Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .dashboard-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
        }

        .header h1 {
            color: #4a5568;
            font-size: 2.5rem;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .header p {
            color: #718096;
            font-size: 1.1rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .stat-card h3 {
            font-size: 2.5rem;
            color: #4a5568;
            margin-bottom: 10px;
        }

        .stat-card p {
            color: #718096;
            font-size: 1rem;
        }

        .stat-icon {
            font-size: 2rem;
            margin-bottom: 15px;
            color: #667eea;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        .section {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .section h2 {
            color: #4a5568;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #4a5568;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: #e2e8f0;
            color: #4a5568;
        }

        .jobs-list {
            max-height: 400px;
            overflow-y: auto;
        }

        .job-item {
            background: #f7fafc;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
        }

        .job-item h4 {
            color: #4a5568;
            margin-bottom: 5px;
        }

        .job-item p {
            color: #718096;
            font-size: 0.9rem;
            margin-bottom: 5px;
        }

        .job-actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .btn-small {
            padding: 6px 12px;
            font-size: 0.8rem;
        }

        .applications-list {
            max-height: 400px;
            overflow-y: auto;
        }

        .application-item {
            background: #f7fafc;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            border-left: 4px solid #48bb78;
        }

        .application-item h4 {
            color: #4a5568;
            margin-bottom: 5px;
        }

        .application-item p {
            color: #718096;
            font-size: 0.9rem;
            margin-bottom: 5px;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .status-pending { background: #fed7d7; color: #c53030; }
        .status-reviewed { background: #bee3f8; color: #2b6cb0; }
        .status-shortlisted { background: #c6f6d5; color: #2f855a; }

        .success-message {
            background: #c6f6d5;
            color: #2f855a;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }
            
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <!-- Header -->
        <div class="header">
            <h1>
                <i class="fas fa-briefcase"></i>
                Sriox Careers Dashboard
            </h1>
            <p>Manage job postings and track applications</p>
        </div>

        <!-- Stats Cards -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon">
                    <i class="fas fa-briefcase"></i>
                </div>
                <h3 id="total-jobs">0</h3>
                <p>Total Job Postings</p>
            </div>
            <div class="stat-card">
                <div class="stat-icon">
                    <i class="fas fa-eye"></i>
                </div>
                <h3 id="active-jobs">0</h3>
                <p>Active Postings</p>
            </div>
            <div class="stat-card">
                <div class="stat-icon">
                    <i class="fas fa-users"></i>
                </div>
                <h3 id="total-applications">0</h3>
                <p>Total Applications</p>
            </div>
            <div class="stat-card">
                <div class="stat-icon">
                    <i class="fas fa-clock"></i>
                </div>
                <h3 id="pending-applications">0</h3>
                <p>Pending Review</p>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Add New Job Section -->
            <div class="section">
                <h2>
                    <i class="fas fa-plus-circle"></i>
                    Add New Job
                </h2>
                
                <div id="success-message" class="success-message">
                    <i class="fas fa-check-circle"></i> Job posted successfully!
                </div>

                <form id="job-form">
                    <div class="form-group">
                        <label for="job-title">Job Title</label>
                        <input type="text" id="job-title" name="title" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="job-department">Department</label>
                        <select id="job-department" name="department" required>
                            <option value="">Select Department</option>
                            <option value="engineering">Engineering</option>
                            <option value="marketing">Marketing</option>
                            <option value="sales">Sales</option>
                            <option value="hr">Human Resources</option>
                            <option value="finance">Finance</option>
                            <option value="operations">Operations</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="job-location">Location</label>
                        <input type="text" id="job-location" name="location" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="job-type">Job Type</label>
                        <select id="job-type" name="type" required>
                            <option value="">Select Type</option>
                            <option value="full-time">Full-time</option>
                            <option value="part-time">Part-time</option>
                            <option value="contract">Contract</option>
                            <option value="internship">Internship</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="job-description">Job Description</label>
                        <textarea id="job-description" name="description" required></textarea>
                    </div>
                    
                    <div class="form-group">
                        <label for="job-requirements">Requirements</label>
                        <textarea id="job-requirements" name="requirements" required></textarea>
                    </div>
                    
                    <button type="submit" class="btn">
                        <i class="fas fa-plus"></i>
                        Post Job
                    </button>
                </form>
            </div>

            <!-- Job Listings Section -->
            <div class="section">
                <h2>
                    <i class="fas fa-list"></i>
                    Current Job Postings
                </h2>
                
                <div class="jobs-list" id="jobs-list">
                    <!-- Jobs will be populated here -->
                </div>
                
                <button id="refresh-jobs" class="btn btn-secondary">
                    <i class="fas fa-refresh"></i>
                    Refresh Jobs
                </button>
            </div>
        </div>

        <!-- Applications Section -->
        <div class="section" style="margin-top: 30px;">
            <h2>
                <i class="fas fa-file-alt"></i>
                Recent Applications
            </h2>
            
            <div class="applications-list" id="applications-list">
                <!-- Applications will be populated here -->
            </div>
            
            <button id="refresh-applications" class="btn btn-secondary">
                <i class="fas fa-refresh"></i>
                Refresh Applications
            </button>
        </div>
    </div>

    <script type="module" src="js/simple-dashboard.js"></script>
</body>
</html>
