<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Jobs API</title>
</head>
<body>
    <h1>Test Jobs API</h1>
    <button onclick="testAPI()">Test Firebase Jobs API</button>
    <div id="results"></div>

    <script>
        async function testAPI() {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = 'Loading...';
            
            try {
                console.log('🔄 Testing jobs API...');
                
                const response = await fetch('https://firestore.googleapis.com/v1/projects/sriox-f5ae4/databases/(default)/documents/jobs');
                
                console.log('Response status:', response.status);
                console.log('Response ok:', response.ok);
                
                if (!response.ok) {
                    throw new Error(`Firebase request failed: ${response.status}`);
                }
                
                const data = await response.json();
                console.log('📦 Raw Firebase response:', data);
                
                resultsDiv.innerHTML = `
                    <h3>API Response:</h3>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                `;
                
            } catch (error) {
                console.error('❌ Error:', error);
                resultsDiv.innerHTML = `
                    <h3>Error:</h3>
                    <p style="color: red;">${error.message}</p>
                `;
            }
        }
    </script>
</body>
</html>
