<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sriox Careers Dashboard - Rebuilt</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
        }

        .header h1 {
            color: #4a5568;
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
        }

        .stat-card h3 {
            font-size: 2.5rem;
            color: #4a5568;
            margin-bottom: 10px;
        }

        .stat-card p {
            color: #718096;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        .section {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .section h2 {
            color: #4a5568;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #4a5568;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .success-message {
            background: #c6f6d5;
            color: #2f855a;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            font-weight: 600;
        }

        .error-message {
            background: #fed7d7;
            color: #c53030;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            font-weight: 600;
        }

        .jobs-list {
            max-height: 500px;
            overflow-y: auto;
        }

        .job-item {
            background: #f7fafc;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
        }

        .job-item h4 {
            color: #4a5568;
            margin-bottom: 10px;
        }

        .job-item p {
            color: #718096;
            margin-bottom: 5px;
            font-size: 0.9rem;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #718096;
        }

        .debug-info {
            background: #f0f4f8;
            border: 1px solid #cbd5e0;
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
            font-family: monospace;
            font-size: 0.85rem;
            max-height: 200px;
            overflow-y: auto;
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }
            
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1><i class="fas fa-briefcase"></i> Sriox Careers Dashboard</h1>
            <p>Simple and reliable job management system</p>
        </div>

        <!-- Stats -->
        <div class="stats-grid">
            <div class="stat-card">
                <h3 id="total-jobs">0</h3>
                <p><i class="fas fa-briefcase"></i> Total Jobs</p>
            </div>
            <div class="stat-card">
                <h3 id="active-jobs">0</h3>
                <p><i class="fas fa-eye"></i> Active Jobs</p>
            </div>
            <div class="stat-card">
                <h3 id="firebase-status">❓</h3>
                <p><i class="fas fa-database"></i> Firebase Status</p>
            </div>
            <div class="stat-card">
                <h3 id="last-update">Never</h3>
                <p><i class="fas fa-clock"></i> Last Update</p>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Add Job Form -->
            <div class="section">
                <h2><i class="fas fa-plus-circle"></i> Add New Job</h2>
                
                <div id="success-msg" class="success-message"></div>
                <div id="error-msg" class="error-message"></div>

                <form id="job-form">
                    <div class="form-group">
                        <label for="title">Job Title *</label>
                        <input type="text" id="title" name="title" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="department">Department *</label>
                        <select id="department" name="department" required>
                            <option value="">Select Department</option>
                            <option value="engineering">Engineering</option>
                            <option value="marketing">Marketing</option>
                            <option value="sales">Sales</option>
                            <option value="hr">Human Resources</option>
                            <option value="finance">Finance</option>
                            <option value="operations">Operations</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="location">Location *</label>
                        <input type="text" id="location" name="location" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="type">Job Type *</label>
                        <select id="type" name="type" required>
                            <option value="">Select Type</option>
                            <option value="full-time">Full-time</option>
                            <option value="part-time">Part-time</option>
                            <option value="contract">Contract</option>
                            <option value="internship">Internship</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="description">Description *</label>
                        <textarea id="description" name="description" required></textarea>
                    </div>
                    
                    <div class="form-group">
                        <label for="requirements">Requirements *</label>
                        <textarea id="requirements" name="requirements" required></textarea>
                    </div>
                    
                    <button type="submit" id="submit-btn" class="btn">
                        <i class="fas fa-plus"></i> Add Job
                    </button>
                </form>
            </div>

            <!-- Jobs List -->
            <div class="section">
                <h2><i class="fas fa-list"></i> Current Jobs</h2>
                
                <div class="loading" id="loading">
                    <i class="fas fa-spinner fa-spin"></i> Loading jobs...
                </div>
                
                <div id="jobs-container" style="display: none;">
                    <div class="jobs-list" id="jobs-list"></div>
                    
                    <button id="refresh-btn" class="btn" style="margin-top: 15px;">
                        <i class="fas fa-refresh"></i> Refresh
                    </button>
                </div>
            </div>
        </div>

        <!-- Debug Information -->
        <div class="section" style="margin-top: 30px;">
            <h2><i class="fas fa-bug"></i> Debug Information</h2>
            <div id="debug-info" class="debug-info">
                Dashboard loaded successfully. Waiting for interactions...
            </div>
        </div>
    </div>

    <script>
        // Simple Dashboard with Pure JavaScript (No modules to avoid import issues)
        class RebuildDashboard {
            constructor() {
                this.jobs = [];
                this.debugLog = [];
                this.PROJECT_ID = 'sriox-f5ae4';
                this.BASE_URL = `https://firestore.googleapis.com/v1/projects/${this.PROJECT_ID}/databases/(default)/documents/jobs`;
                
                this.log('🚀 Dashboard initializing...');
                this.initElements();
                this.setupEvents();
                this.loadJobs();
            }

            initElements() {
                // Form elements
                this.form = document.getElementById('job-form');
                this.submitBtn = document.getElementById('submit-btn');
                
                // Display elements
                this.jobsList = document.getElementById('jobs-list');
                this.loading = document.getElementById('loading');
                this.jobsContainer = document.getElementById('jobs-container');
                
                // Stats
                this.totalJobsEl = document.getElementById('total-jobs');
                this.activeJobsEl = document.getElementById('active-jobs');
                this.firebaseStatusEl = document.getElementById('firebase-status');
                this.lastUpdateEl = document.getElementById('last-update');
                
                // Messages
                this.successMsg = document.getElementById('success-msg');
                this.errorMsg = document.getElementById('error-msg');
                
                // Debug
                this.debugEl = document.getElementById('debug-info');
                
                // Check if debug element exists
                if (!this.debugEl) {
                    console.warn('Debug element not found');
                    this.debugEl = { textContent: '', scrollTop: 0, scrollHeight: 0 }; // Mock element
                }
                
                this.log('✅ Elements initialized');
            }

            setupEvents() {
                this.form.addEventListener('submit', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    this.log('📝 Form submitted');
                    this.addJob();
                    return false;
                });

                document.getElementById('refresh-btn').addEventListener('click', () => {
                    this.log('🔄 Refresh clicked');
                    this.loadJobs();
                });

                this.log('✅ Event listeners setup');
            }

            async loadJobs() {
                this.log('📋 Loading jobs from Firebase...');
                this.showLoading(true);
                
                try {
                    const response = await fetch(this.BASE_URL);
                    
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                    }
                    
                    const data = await response.json();
                    this.jobs = [];
                    
                    if (data.documents) {
                        this.jobs = data.documents.map(doc => {
                            const fields = doc.fields;
                            return {
                                id: doc.name.split('/').pop(),
                                title: fields.title?.stringValue || 'No Title',
                                department: fields.department?.stringValue || 'Unknown',
                                location: fields.location?.stringValue || 'Unknown',
                                type: fields.type?.stringValue || 'Unknown',
                                description: fields.description?.stringValue || 'No description',
                                requirements: fields.requirements?.stringValue || 'No requirements',
                                isActive: fields.isActive?.booleanValue !== false,
                                createdAt: fields.createdAt?.timestampValue || new Date().toISOString()
                            };
                        });
                    }
                    
                    this.log(`✅ Loaded ${this.jobs.length} jobs from Firebase`);
                    this.firebaseStatusEl.textContent = '✅';
                    this.firebaseStatusEl.parentElement.querySelector('p').innerHTML = '<i class="fas fa-database"></i> Connected';
                    
                } catch (error) {
                    this.log(`❌ Error loading jobs: ${error.message}`);
                    this.firebaseStatusEl.textContent = '❌';
                    this.firebaseStatusEl.parentElement.querySelector('p').innerHTML = '<i class="fas fa-database"></i> Error';
                    
                    // Use mock data as fallback
                    this.jobs = [
                        {
                            id: 'mock-1',
                            title: 'Sample Software Engineer',
                            department: 'engineering',
                            location: 'Remote',
                            type: 'full-time',
                            description: 'Sample job (Firebase connection failed)',
                            requirements: 'Sample requirements',
                            isActive: true,
                            createdAt: new Date().toISOString()
                        }
                    ];
                }
                
                this.renderJobs();
                this.updateStats();
                this.showLoading(false);
            }

            async addJob() {
                this.log('📝 Adding new job...');
                this.submitBtn.disabled = true;
                this.submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Adding...';
                
                try {
                    const formData = new FormData(this.form);
                    const jobData = {
                        fields: {
                            title: { stringValue: formData.get('title') },
                            department: { stringValue: formData.get('department') },
                            location: { stringValue: formData.get('location') },
                            type: { stringValue: formData.get('type') },
                            description: { stringValue: formData.get('description') },
                            requirements: { stringValue: formData.get('requirements') },
                            isActive: { booleanValue: true },
                            createdAt: { timestampValue: new Date().toISOString() }
                        }
                    };

                    this.log('📤 Sending job data to Firebase...');
                    
                    const response = await fetch(this.BASE_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(jobData)
                    });

                    if (!response.ok) {
                        const errorText = await response.text();
                        throw new Error(`HTTP ${response.status}: ${errorText}`);
                    }

                    const result = await response.json();
                    const jobId = result.name.split('/').pop();
                    
                    this.log(`✅ Job added successfully with ID: ${jobId}`);
                    this.showSuccess('Job added successfully!');
                    this.form.reset();
                    
                    // Reload jobs
                    setTimeout(() => this.loadJobs(), 500);
                    
                } catch (error) {
                    this.log(`❌ Error adding job: ${error.message}`);
                    this.showError(`Failed to add job: ${error.message}`);
                } finally {
                    this.submitBtn.disabled = false;
                    this.submitBtn.innerHTML = '<i class="fas fa-plus"></i> Add Job';
                }
            }

            renderJobs() {
                if (this.jobs.length === 0) {
                    this.jobsList.innerHTML = `
                        <div class="loading">
                            <i class="fas fa-briefcase" style="font-size: 3rem; margin-bottom: 15px;"></i>
                            <p>No jobs found</p>
                        </div>
                    `;
                    return;
                }

                this.jobsList.innerHTML = this.jobs.map(job => `
                    <div class="job-item">
                        <h4>${job.title}</h4>
                        <p><i class="fas fa-building"></i> ${job.department}</p>
                        <p><i class="fas fa-map-marker-alt"></i> ${job.location}</p>
                        <p><i class="fas fa-clock"></i> ${job.type}</p>
                        <p><i class="fas fa-calendar"></i> ${this.formatDate(job.createdAt)}</p>
                        <p style="margin-top: 10px;"><strong>Description:</strong> ${job.description.substring(0, 100)}...</p>
                    </div>
                `).join('');
            }

            updateStats() {
                const activeJobs = this.jobs.filter(job => job.isActive);
                
                this.totalJobsEl.textContent = this.jobs.length;
                this.activeJobsEl.textContent = activeJobs.length;
                this.lastUpdateEl.textContent = new Date().toLocaleTimeString();
            }

            showLoading(show) {
                this.loading.style.display = show ? 'block' : 'none';
                this.jobsContainer.style.display = show ? 'none' : 'block';
            }

            showSuccess(message) {
                this.successMsg.textContent = message;
                this.successMsg.style.display = 'block';
                this.errorMsg.style.display = 'none';
                setTimeout(() => {
                    this.successMsg.style.display = 'none';
                }, 5000);
            }

            showError(message) {
                this.errorMsg.textContent = message;
                this.errorMsg.style.display = 'block';
                this.successMsg.style.display = 'none';
            }

            formatDate(dateString) {
                try {
                    return new Date(dateString).toLocaleDateString();
                } catch {
                    return 'Unknown';
                }
            }

            log(message) {
                const timestamp = new Date().toLocaleTimeString();
                const logEntry = `[${timestamp}] ${message}`;
                this.debugLog.push(logEntry);
                
                // Keep only last 20 logs
                if (this.debugLog.length > 20) {
                    this.debugLog.shift();
                }
                
                // Only update debug element if it exists
                if (this.debugEl && this.debugEl.textContent !== undefined) {
                    this.debugEl.textContent = this.debugLog.join('\n');
                    this.debugEl.scrollTop = this.debugEl.scrollHeight;
                }
                
                console.log(message);
            }
        }

        // Initialize dashboard when page loads
        document.addEventListener('DOMContentLoaded', () => {
            window.dashboard = new RebuildDashboard();
        });
    </script>
</body>
</html>
